<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Utylizacji Odpadów</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .card { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .status-box { font-weight: bold; padding: 10px; border-radius: 5px; text-align: center; margin-top: 20px;}
        .status-pending { background-color: #fff3cd; color: #856404; }
        .status-success { background-color: #d4edda; color: #155724; }
        .status-danger { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h4>♻️ Zlecenie Utylizacji Odpadów</h4>
                </div>
                <div class="card-body">
                    
                    <form id="disposalForm">
                        <div class="mb-3">
                            <label for="wasteType" class="form-label">Rodzaj Odpadu</label>
                            <input type="text" class="form-control" id="wasteType" placeholder="np. Plastik, Odpady Chemiczne" required>
                            <div class="form-text">Wpisz "radio" aby przetestować odrzucenie.</div>
                        </div>
                        <div class="mb-3">
                            <label for="weight" class="form-label">Waga (kg)</label>
                            <input type="number" class="form-control" id="weight" placeholder="np. 100" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Wyślij Zlecenie</button>
                    </form>

                    <div id="resultSection" class="d-none mt-4">
                        <hr>
                        <h5>Status Twojego Zlecenia:</h5>
                        <p>ID Transakcji: <code id="requestId">---</code></p>
                        
                        <div id="statusBox" class="status-box status-pending">
                            Oczekiwanie na przetworzenie...
                            <div class="spinner-border spinner-border-sm ms-2" role="status"></div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const GATEWAY_URL = "http://127.0.0.1:8000";
    let pollingInterval = null;

    document.getElementById('disposalForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const wasteType = document.getElementById('wasteType').value;
        const weight = parseFloat(document.getElementById('weight').value);

        try {
            const response = await fetch(`${GATEWAY_URL}/request`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ waste_type: wasteType, weight: weight })
            });

            if (!response.ok) {
                alert("Błąd połączenia z serwerem!");
                return;
            }

            const data = await response.json();
            console.log("Otrzymana odpowiedź z serwera:", data);
            const requestId = data.id;

            document.getElementById('resultSection').classList.remove('d-none');
            document.getElementById('requestId').innerText = requestId;
            
            updateStatusDisplay("started");

            if (pollingInterval) clearInterval(pollingInterval);
            pollingInterval = setInterval(() => checkStatus(requestId), 2000);

        } catch (error) {
            console.error("Błąd:", error);
            alert("Nie udało się połączyć z API Gateway. Czy serwer działa?");
        }
    });

    async function checkStatus(id) {
        try {
            const response = await fetch(`${GATEWAY_URL}/request/${id}`);
            const data = await response.json();
            
            const status = data.status; 

            console.log("Aktualny status z serwera:", status);
            updateStatusDisplay(status);

            if (status === "approved" || status === "rejected") {
                clearInterval(pollingInterval);
            }

        } catch (error) {
            console.error("Błąd podczas sprawdzania statusu:", error);
        }
    }

    function updateStatusDisplay(status) {
        const box = document.getElementById('statusBox');
        
        const s = status ? status.toLowerCase() : ""; 

        if (s === "approved") {
            box.className = "status-box status-success";
            box.innerHTML = "✅ ZATWIERDZONO (KPO Wygenerowane)";
        } 
        else if (s === "rejected") {
            box.className = "status-box status-danger";
            box.innerHTML = "⛔ ODRZUCONO (Odpady Niebezpieczne!)";
        } 
        else if (s === "started") {
            box.className = "status-box status-pending";
            box.innerHTML = `🚀 ROZPOCZĘTO... <div class="spinner-border spinner-border-sm ms-2"></div>`;
        }
        else if (s === "pending") {
            box.className = "status-box status-pending";
            box.innerHTML = `⏳ PRZETWARZANIE... <div class="spinner-border spinner-border-sm ms-2"></div>`;
        } 
        else {
            box.className = "status-box status-pending";
            box.innerHTML = `❓ Status: ${status} <div class="spinner-border spinner-border-sm ms-2"></div>`;
        }
    }
</script>

</body>
</html>
